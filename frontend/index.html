<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light by default whatever the device prefers; the app updates this when a
         person chooses the dark theme. -->
    <meta name="theme-color" content="#f5f7fa" />
    <meta
      name="description"
      content="NyaySetu records evidence, summons and bail conditions with fingerprints anchored to a public blockchain, so integrity is something anyone can check rather than something a party asserts."
    />

    <title>NyaySetu — Bridge of Justice</title>
    <script>
      // Before first paint: the saved theme, language and text size, so nothing
      // flashes. Light is the default whatever the operating system prefers.
      try {
        var d = document.documentElement;
        var t = localStorage.getItem("nyaysetu.theme");
        d.setAttribute("data-theme", t === "dark" ? "dark" : "light");
        var l = localStorage.getItem("nyaysetu.lang");
        if (l === "hi" || l === "mr") d.setAttribute("lang", l);
        if (localStorage.getItem("nyaysetu.textSize") === "large") d.setAttribute("data-text-size", "large");
      } catch (e) {}
    </script>

    <!--
      The logo's white strokes are negative space, so a transparent favicon
      vanishes on a dark browser tab. Every icon here is pre-composited onto an
      opaque white plate, which is also why there is no SVG version: the plate
      has to be baked in.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:title" content="NyaySetu - Bridge of Justice" />
    <meta
      property="og:description"
      content="Evidence digests, summons acknowledgements and bail conditions anchored to a public blockchain."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts. preconnect first so the handshake overlaps HTML parsing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Montserrat:ital,wght@0,300..800;1,300..700&family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div id="root"></div>
    <noscript>
      NyaySetu needs JavaScript: evidence digests are computed in your browser
      before anything is uploaded, which is not something a server can do for you.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
